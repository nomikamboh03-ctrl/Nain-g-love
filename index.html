<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For You</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d0a16;--card:#ffffff12;--rose:#ff4f87;--rose2:#ff8fb1;--blush:#ffe1ea;--gold:#f6c177;--ink:#fff5f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#6b1f45 0,#2c0f20 55%,var(--bg) 100%) fixed;color:var(--ink);font-family:Nunito,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;overflow-x:hidden}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.h{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite}
@keyframes rise{10%{opacity:.55}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.screen{display:none;position:relative;z-index:1;width:100%;max-width:420px;text-align:center;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ff8fb155;border-radius:32px;padding:34px 22px;box-shadow:0 20px 60px #00000070,0 0 50px #ff4f8730}
.screen.on{display:block;animation:in .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.94)}}
h1,h2{font-family:'Playfair Display',Georgia,serif;font-weight:600;margin:0 0 20px;line-height:1.25}
h1{font-size:2.1rem}h2{font-size:1.75rem}
.gold{color:var(--gold)}
p{margin:0 0 18px;line-height:1.6}
.big{font-size:4.2rem;margin-bottom:10px;filter:drop-shadow(0 0 18px #ff4f87aa);animation:beat 1.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.pin{display:flex;gap:12px;justify-content:center;margin-bottom:14px}
.pin span{width:48px;height:58px;border-radius:16px;background:#00000040;border:2px solid #ff8fb166;font-size:1.6rem;line-height:54px;color:var(--gold);transition:.2s}
.pin span.f{border-color:var(--gold);box-shadow:0 0 14px #f6c17766}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
button{font:inherit;font-weight:700;border:0;border-radius:18px;padding:15px;color:var(--ink);background:#ffffff1c;cursor:pointer;font-size:1.25rem;transition:transform .12s,background .2s}
button:hover{background:#ffffff30}
button:active{transform:scale(.94)}
button:focus-visible{outline:3px solid var(--gold)}
.yes{background:linear-gradient(135deg,var(--rose),#ff7aa5);box-shadow:0 8px 24px #ff4f8750}
.yes:hover{background:linear-gradient(135deg,#ff6a9a,#ff8fb1)}
.row{display:flex;gap:14px}.row button{flex:1}
.err{color:var(--rose2);min-height:1.4em;margin:0 0 12px}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.prog{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.prog i{width:26px;height:5px;border-radius:5px;background:#ffffff30}
.prog i.d{background:var(--rose)}
.cry{font-size:6rem;display:inline-block;animation:cry 1s infinite}
@keyframes cry{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(8px) rotate(7deg)}}
.tear{display:inline-block;animation:drop 1.2s infinite;font-size:2rem;margin-left:-14px}
@keyframes drop{0%{transform:translateY(-20px);opacity:0}60%{opacity:1}100%{transform:translateY(34px);opacity:0}}
.duo{display:grid;grid-template-columns:1fr 76px 1fr;align-items:center;gap:4px;margin-bottom:18px}
.pol{background:#fff8f3;padding:8px 8px 10px;border-radius:6px;box-shadow:0 10px 26px #00000070;color:#4a1a30}
.pol:first-child{transform:rotate(-4deg)}.pol:last-child{transform:rotate(4deg)}
.pol img,.ph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:3px;background:#f3d9e2;display:flex;align-items:center;justify-content:center;font-size:2.6rem}
.cap{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:.85rem;margin-top:7px}
.fp{width:76px;height:76px;position:relative;color:var(--gold);border-radius:50%;border:2px solid #f6c17766;display:flex;align-items:center;justify-content:center;padding:0;background:#00000030;overflow:hidden;animation:pulse 1.5s infinite}
.fp:hover{background:#00000030}
.fp svg{width:46px;height:46px}
.fp.scan{border-color:#6dffb0;color:#6dffb0;box-shadow:0 0 24px #6dffb088;animation:none}
.fp.scan::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:#6dffb0;box-shadow:0 0 12px 2px #6dffb0;animation:sweep .9s linear infinite alternate}
@keyframes sweep{to{top:calc(100% - 4px)}}
.fp.ok{animation:none;border-color:var(--gold);box-shadow:0 0 24px #f6c17788}
@keyframes pulse{50%{transform:scale(1.25)}}
.msg{display:none;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:1.2rem;line-height:1.75;color:var(--blush);min-height:6em}
.sig{display:none;font-style:normal;color:var(--gold);margin-top:12px;font-size:1.1rem}
.conf{position:fixed;top:-30px;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="hearts"></div>

<section class="screen on" id="lock">
  <div class="big">🔒</div>
  <h1>Enter our code</h1>
  <div class="pin" id="dots"><span></span><span></span><span></span><span></span></div>
  <p class="err" id="err"></p>
  <div class="pad" id="pad"></div>
</section>

<section class="screen" id="q">
  <div class="prog" id="prog"></div>
  <div class="big" id="qe">💕</div>
  <h2 id="qt"></h2>
  <div class="row"><button class="yes" id="yes">Yes</button><button id="no">No</button></div>
</section>

<section class="screen" id="hate">
  <div class="big">😡</div>
  <h1>I hate you</h1>
  <button id="back">Go back</button>
</section>

<section class="screen" id="cry">
  <div class="cry">😭</div><span class="tear">💧</span>
  <h2>Please, think again…</h2>
  <button id="back2">Go back</button>
</section>

<section class="screen" id="end">
  <h2>Yes, <span class="gold">forever</span> 💖</h2>
  <div class="duo">
    <div class="pol"><img id="boy" alt="Boy"><div class="cap">Nouman Love Nain</div></div>
    <button class="fp" id="fp" aria-label="Touch to scan">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
        <path d="M8 32C8 19 18 10 32 10s24 9 24 22"/>
        <path d="M14 28a18 18 0 0 1 36 0v6"/>
        <path d="M20 32a12 12 0 0 1 24 0v8c0 5 1 9 3 12"/>
        <path d="M26 36a6 6 0 0 1 12 0v8c0 5 2 9 5 12"/>
        <path d="M32 38v8c0 6-2 9-5 13"/>
        <path d="M20 38v6c0 6-2 10-4 13"/>
        <path d="M14 36v6c0 4-1 7-2 9"/>
      </svg>
    </button>
    <div class="pol"><img id="girl" alt="Girl"><div class="cap">Naina Love Nouman</div></div>
  </div>
  <p id="hint">Touch the fingerprint to scan ☝️</p>
  <div class="msg" id="msg"></div>
  <div class="msg sig" id="sig">Forever yours ❤️</div>
</section>

var QUESTIONS = [
  "Do you love me?",
  "Are you sure about us?",
  "Will you always stay with me?",
  "Will you marry me?"   // keep this one last
];
var EMOJIS = ["💕","🤔","🥺","💍"];
var MESSAGE = "Muqadas Tanveer, you are my peace, my smile and my every tomorrow. I love you more than words can say.";
// ======================

var $ = function(id){return document.getElementById(id)};
function show(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on')});
  $(id).classList.add('on');
}

// Floating hearts background
(function(){
  var set = ["💗","💖","💕","✨","🌸"];
  for (var i=0;i<16;i++){
    var s = document.createElement('span');
    s.className = 'h';
    s.textContent = set[i % set.length];
    s.style.left = (Math.random()*100)+'%';
    s.style.fontSize = (14+Math.random()*22)+'px';
    s.style.animationDuration = (9+Math.random()*10)+'s';
    s.style.animationDelay = (-Math.random()*14)+'s';
    $('hearts').appendChild(s);
  }
})();

function driveId(u){
  var m = (u||"").match(/\/d\/([\w-]+)/) || (u||"").match(/[?&]id=([\w-]+)/);
  return m ? m[1] : "";
}
function photo(el, url, emoji){
  function fallback(){
    var d = document.createElement('div');
    d.className = 'ph'; d.textContent = emoji;
    el.replaceWith(d);
  }
  if (url && url.indexOf("data:") === 0){ el.onerror = fallback; el.src = url; return; }
  var id = driveId(url);
  if (!id) return fallback();
  var tries = [
    "https://drive.google.com/thumbnail?id=" + id + "&sz=w1000",
    "https://lh3.googleusercontent.com/d/" + id + "=w1000",
    "https://drive.google.com/uc?export=view&id=" + id
  ];
  var i = 0;
  el.referrerPolicy = "no-referrer";
  el.onerror = function(){
    i++;
    if (i < tries.length) el.src = tries[i]; else fallback();
  };
  el.src = tries[0];
}

// Lock screen
var entered = "";
["1","2","3","4","5","6","7","8","9","⌫","0","✓"].forEach(function(k){
  var b = document.createElement('button');
  b.textContent = k;
  b.onclick = function(){ key(k) };
  $('pad').appendChild(b);
});
function paint(){
  var d = $('dots').children;
  for (var i=0;i<d.length;i++){
    var on = i < entered.length;
    d[i].textContent = on ? "●" : "";
    d[i].className = on ? "f" : "";
  }
}
function key(k){
  $('err').textContent = "";
  if (k === "⌫") entered = entered.slice(0,-1);
  else if (k === "✓") return check();
  else if (entered.length < PIN.length) entered += k;
  paint();
  if (entered.length === PIN.length) setTimeout(check, 150);
}
function check(){
  if (entered === PIN){ entered=""; paint(); start(); }
  else {
    $('err').textContent = "Wrong code. Try again.";
    var p = $('dots'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake');
    entered = ""; paint();
  }
}

// Questions
var idx = 0;
function start(){ idx = 0; ask(); }
function ask(){
  $('qt').textContent = QUESTIONS[idx];
  $('qe').textContent = EMOJIS[idx] || "💕";
  var p = $('prog'); p.innerHTML = "";
  QUESTIONS.forEach(function(_,i){
    var b = document.createElement('i');
    if (i <= idx) b.className = 'd';
    p.appendChild(b);
  });
  show('q');
}
$('yes').onclick = function(){
  if (idx < QUESTIONS.length - 1){ idx++; ask(); }
  else finale();
};
$('no').onclick = function(){
  show(idx === QUESTIONS.length - 1 ? 'cry' : 'hate');
};
$('back').onclick = ask;
$('back2').onclick = ask;

// Finale
function finale(){
  photo($('boy'), BOY_PHOTO, "🧑");
  photo($('girl'), GIRL_PHOTO, "👩");
  show('end');
  confetti();
}
function confetti(){
  var set = ["💖","💗","🌹","✨","💕"];
  for (var i=0;i<34;i++){
    var c = document.createElement('span');
    c.className = 'conf';
    c.textContent = set[i % set.length];
    c.style.left = (Math.random()*100)+'%';
    c.style.fontSize = (16+Math.random()*20)+'px';
    c.style.animationDuration = (3+Math.random()*3)+'s';
    c.style.animationDelay = (Math.random()*1.5)+'s';
    document.body.appendChild(c);
    setTimeout(function(el){el.remove()}, 8000, c);
  }
}
var scanning = false;
$('fp').onclick = function(){
  if (scanning) return;
  scanning = true;
  var fp = $('fp'), h = $('hint'), n = 0;
  fp.classList.add('scan');
  h.textContent = "Scanning… 0%";
  var s = setInterval(function(){
    n += 2;
    h.textContent = "Scanning… " + n + "%";
    if (n >= 100){
      clearInterval(s);
      fp.classList.remove('scan'); fp.classList.add('ok');
      h.textContent = "Matched ✓ 💖";
      setTimeout(reveal, 800);
    }
  }, 50);
};
function reveal(){
  $('hint').style.display = 'none';
  confetti();
  var m = $('msg'); m.style.display = 'block'; m.textContent = "";
  var i = 0;
  var t = setInterval(function(){
    m.textContent = MESSAGE.slice(0, ++i);
    if (i >= MESSAGE.length){ clearInterval(t); $('sig').style.display = 'block'; }
  }, 45);
}
</script>
